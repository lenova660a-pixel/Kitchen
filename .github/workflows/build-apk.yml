name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Force Custom App Icon & Splash for Android 11-15
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image

          res_dir = 'android/app/src/main/res'
          icon_path = 'resources/icon.png'

          if os.path.exists(icon_path):
              img = Image.open(icon_path).convert('RGBA')
          else:
              # Fallback: створюємо фірмовий значок векторно
              img = Image.new('RGBA', (512, 512), color='#E58A00')

          # --- Іконка застосунку ---
          icon_sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }
          for folder, size in icon_sizes.items():
              target_folder = os.path.join(res_dir, folder)
              os.makedirs(target_folder, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_folder, 'ic_launcher.png'))
              resized.save(os.path.join(target_folder, 'ic_launcher_round.png'))
              resized_fg = img.resize((int(size * 1.4), int(size * 1.4)), Image.Resampling.LANCZOS)
              resized_fg.save(os.path.join(target_folder, 'ic_launcher_foreground.png'))

          # Видаляємо дефолтні XML для примусового показу PNG-іконки
          for xml_folder in ['mipmap-anydpi-v26']:
              p = os.path.join(res_dir, xml_folder)
              if os.path.exists(p):
                  for f_name in os.listdir(p):
                      if f_name.startswith('ic_launcher'):
                          os.remove(os.path.join(p, f_name))

          # --- Нативний Splash Screen (лого на фірмовому фоні) ---
          bg_color = (238, 244, 232, 255)  # #EEF4E8
          for root, _dirs, files in os.walk(res_dir):
              for fname in files:
                  if fname == 'splash.png':
                      target = os.path.join(root, fname)
                      with Image.open(target) as ref:
                          w, h = ref.size
                      canvas = Image.new('RGBA', (w, h), bg_color)
                      logo_size = int(min(w, h) * 0.42)
                      logo = img.resize((logo_size, logo_size), Image.Resampling.LANCZOS)
                      canvas.paste(logo, ((w - logo_size) // 2, (h - logo_size) // 2), logo)
                      canvas.convert('RGB').save(target)

          print("✅ Іконку та Splash Screen успішно інтегровано у всі системні ресурси Android!")
          EOF

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatToCook-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

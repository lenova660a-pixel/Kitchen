name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Android App Desktop Icons
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFA41C"/>
                <stop offset="100%" stop-color="#D97706"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="110" fill="url(#bg)"/>
            <path d="M256 120 C230 75 160 85 155 140 C120 145 110 200 150 225 C170 238 342 238 362 225 C402 200 392 145 357 140 C352 85 282 75 256 120 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="8"/>
            <path d="M165 230 L347 230 L340 270 L172 270 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="6"/>
            <path d="M120 380 L390 190 L400 205 L130 395 Z" fill="#E2E8F0" stroke="#334155" stroke-width="8"/>
            <rect x="90" y="380" width="70" height="25" rx="8" transform="rotate(-35 125 392)" fill="#1E293B"/>
            <path d="M392 380 L122 190 L112 205 L382 395 Z" fill="#CBD5E1" stroke="#334155" stroke-width="8"/>
            <rect x="352" y="380" width="70" height="25" rx="8" transform="rotate(35 387 392)" fill="#1E293B"/>
          </svg>
          EOF
          npm install @capacitor/assets --save-dev
          npx @capacitor/assets generate --android --assetPath assets || true
          npx cap copy android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatToCook-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

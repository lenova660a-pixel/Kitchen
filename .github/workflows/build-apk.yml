name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Copy icon to web folder
        run: |
          mkdir -p www
          if [ -f icon.png ]; then cp icon.png www/icon.png; fi

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Desktop App Icons (Android 11-15)
        run: |
          python3 - << 'EOF'
          import os
          from PIL import Image

          icon_path = 'icon.png'
          if not os.path.exists(icon_path) and os.path.exists('www/icon.png'):
              icon_path = 'www/icon.png'

          if os.path.exists(icon_path):
              img = Image.open(icon_path).convert('RGBA')
              res_dir = 'android/app/src/main/res'
              
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              
              for folder, size in sizes.items():
                  target_folder = os.path.join(res_dir, folder)
                  os.makedirs(target_folder, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  
                  # Заміна стандартних іконок
                  resized.save(os.path.join(target_folder, 'ic_launcher.png'))
                  resized.save(os.path.join(target_folder, 'ic_launcher_round.png'))
                  
                  # Для адаптивних іконок Android 11-15
                  resized_fg = img.resize((int(size * 1.5), int(size * 1.5)), Image.Resampling.LANCZOS)
                  resized_fg.save(os.path.join(target_folder, 'ic_launcher_foreground.png'))
              print("✅ Всі іконки для робочого столу успішно сгенеровані!")
          else:
              print("⚠️ Файл icon.png не знайдено в корені")
          EOF

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatToCook-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

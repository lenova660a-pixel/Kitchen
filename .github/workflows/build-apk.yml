name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Force Custom App Icon for Android 11-15
        run: |
          python3 - << 'EOF'
          import os
          import re
          import base64
          from PIL import Image
          import io

          # Витягуємо Base64 іконки з index.html
          with open('www/index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          match = re.search(r'data:image/png;base64,([^"\'\)]+)', content)
          if match:
              img_data = base64.b64decode(match.group(1))
              img = Image.open(io.BytesIO(img_data)).convert('RGBA')
              res_dir = 'android/app/src/main/res'
              
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              
              for folder, size in sizes.items():
                  target_folder = os.path.join(res_dir, folder)
                  os.makedirs(target_folder, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  
                  # Заміна стандартних іконок
                  resized.save(os.path.join(target_folder, 'ic_launcher.png'))
                  resized.save(os.path.join(target_folder, 'ic_launcher_round.png'))
                  
                  # Для адаптивних шарів Android 11-15
                  resized_fg = img.resize((int(size * 1.4), int(size * 1.4)), Image.Resampling.LANCZOS)
                  resized_fg.save(os.path.join(target_folder, 'ic_launcher_foreground.png'))
              
              # Видаляємо дефолтні XML, щоб Android використовував саме PNG-іконку
              for xml_folder in ['mipmap-anydpi-v26']:
                  p = os.path.join(res_dir, xml_folder)
                  if os.path.exists(p):
                      for f_name in os.listdir(p):
                          if f_name.startswith('ic_launcher'):
                              os.remove(os.path.join(p, f_name))
              print("✅ Іконку успішно інтегровано у всі системні ресурси Android!")
          EOF

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatToCook-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
